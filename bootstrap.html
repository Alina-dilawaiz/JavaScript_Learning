<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Centered Button Group</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .cta-button {
            background-color: #f79d65; 
            color: white;
            border-radius: 5px;
            text-align: center;
            /* 1. FLUID PADDING: Vertical padding scales with viewport height (vh) */
            padding-top: 2vh; 
            padding-bottom: 2vh; 
            
            margin-bottom: 10px; /* For mobile stacking spacing */
        }
    </style>
</head>
<body>

    <div class="d-flex align-items-center justify-content-center">
        <div class="row justify-content-center">

            <div class="col-12 col-sm-6 pe-2"> 
                <div class="cta-button">Sign Up Today</div>
            </div>

            <div class="col-12 col-sm-6">
                <div class="cta-button">View Demo</div>
            </div>

        </div>
    </div>

</body>
</html>
