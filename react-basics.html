<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="react-basics.js"></script>
<!-- react contains features shared for websites and mobile apps -->
 <!-- react contains features for websites. -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        const button = <button>hello</button>
        const paragraph = <p>I am a paragraph.</p>

        const div = (
            <div>
                <button>hello</button>
                <p>I am a paragraph. {2+2}</p>
            </div>
        );
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(div);
/* ReactDOM.createRoot---Sets up react */
/* render__display something */
/* Babel--Javascript compier, for converting other lang into js */
/* With react we don't use js, we use jsx(javascript xml) */
    </script>
  </body>
